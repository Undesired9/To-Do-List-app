name: main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "tests/To-Do list app.Tests/To-Do list app.Tests.csproj"

      - name: Build
        run: dotnet build "To-Do list app.csproj" --no-restore --configuration Release

      - name: Test
        run: dotnet test "tests/To-Do list app.Tests/To-Do list app.Tests.csproj" --no-restore --configuration Release
